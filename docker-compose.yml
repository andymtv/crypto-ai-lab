services:
  api:
    build: ./api
    container_name: sol-ai-lab-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ./api:/app
      - ./data:/data
    # Set in .env per machine (see .env.example): a small slice on a low-memory
    # box, the full history on a workstation.
    mem_limit: ${API_MEM_LIMIT:-6g}
    environment:
      LAB_HISTORY_START: ${LAB_HISTORY_START:-2020-08}
      LAB_THREADS: ${LAB_THREADS:-0}

  web:
    image: node:20-alpine
    container_name: sol-ai-lab-web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3100"
    environment:
      VITE_API_URL: http://localhost:8100
    ports:
      - "3100:3100"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  web_node_modules:
